<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAMES — Local AI Terminal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico">
</head>
<body>
  <div id="app-container">
    <header class="terminal-header">
      <h1>JAMES</h1>
      <span id="status-badge" class="badge loading">Initializing Engine...</span>
    </header>
    
    <main id="chat-stream" role="log">
      <!-- Dynamic chat messages render here -->
    </main>

    <footer class="input-container">
      <textarea id="user-input" placeholder="Message local JAMES instance..." rows="1"></textarea>
      <button id="send-btn" aria-label="Send Message">Send</button>
    </footer>
  </div>

  <script src="tool-router.js"></script>
  <script src="app.js"></script>
</body>
</html>
