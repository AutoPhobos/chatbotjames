<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAMES — Free Local AI Chatbot That Runs in Your Browser</title>
    <meta name="description" content="JAMES is a free, private AI chatbot that runs entirely in your browser — no account, no server, no data sent anywhere. Powered by WebGPU for fast local inference with weather, Wikipedia, currency and more built-in tools.">
    <meta name="keywords" content="local AI chatbot, browser AI, offline AI assistant, private AI, no server AI, WebGPU AI, JAMES chatbot, free AI chat">
    <meta name="author" content="Andrey Lopukhov">
    <meta name="robots" content="index, follow">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="canonical" href="https://chatbotjames.onrender.com/">
    <meta property="og:title" content="JAMES — Free Local AI Chatbot That Runs in Your Browser">
    <meta property="og:description" content="A private AI chatbot that runs entirely in your browser. No account, no server, no data sent anywhere. Fast local inference with built-in tools.">
    <meta property="og:image" content="https://chatbotjames.onrender.com/preview.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://chatbotjames.onrender.com/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="JAMES — Free Local AI Chatbot That Runs in Your Browser">
    <meta name="twitter:description" content="A private AI chatbot that runs entirely in your browser. No account, no server, no data sent anywhere.">
    <meta name="twitter:image" content="https://chatbotjames.onrender.com/preview.png">
    <meta name="google-site-verification" content="706qdfPXFXzI_yp0C5jQIii19fSxhf616nNb_4VpdUM" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "JAMES",
      "alternateName": "Just A Machine, Engineered for Speech",
      "url": "https://chatbotjames.onrender.com/",
      "description": "A free, private AI chatbot that runs entirely in your browser using WebGPU or WASM. No account, no server, no data sent anywhere. Includes weather, Wikipedia, currency, time and more built-in tools.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any (browser-based)",
      "browserRequirements": "Requires Chrome, Edge, or Firefox with WebGPU or WASM support",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "author": { "@type": "Person", "name": "Andrey Lopukhov", "url": "https://github.com/tripping-alien" },
      "featureList": "Local inference, WebGPU acceleration, offline capable, weather tool, Wikipedia tool, currency converter, Python execution, no account required",
      "screenshot": "https://chatbotjames.onrender.com/preview.png"
    }
    </script>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="installBanner" class="install-banner hidden">
        <span>Install JAMES as an app for offline access!</span>
        <div class="install-actions">
            <button id="installBtn">Install</button>
            <button id="dismissInstallBtn">✕</button>
        </div>
    </div>
    <div class="main-layout">
        <aside class="sidebar" id="sidebar">
            <button id="newChatBtn" class="new-thread-btn">+ New Chat</button>
            <div id="chatList" class="chat-list"></div>
            <div class="sidebar-footer">
                <a href="about.html">About</a> · <a href="docs.html">Docs</a>
                <div>By Andrey Lopukhov</div>
            </div>
        </aside>

        <main class="terminal-container">
            <header class="terminal-header">
                <div class="header-left">
                    <button id="sidebarToggle" class="icon-btn">☰</button>
                    <div id="led" class="status-led led-idle"></div>
                    <span id="statusText">INITIALIZING...</span>
                </div>
                <div class="header-right">
                    <button id="modelPanelBtn" class="icon-btn" title="Model Settings" aria-label="Open model settings">⚙️</button>
                    v1.0.3
                </div>
            </header>

            <div id="progressContainer" class="progress-container">
                <div id="progFill" class="progress-fill"></div>
            </div>

            <div class="status-meta"></div>

            <div id="chatLog" class="chat-log"></div>

            <footer class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="cmdInput" placeholder="Message JAMES..." autocomplete="off">
                    <button id="sendBtn" class="send-btn">➔</button>
                </div>
            </footer>
        </main>
        <div id="sidebarOverlay"></div>
    </div>

    <!-- ═══ Model Selection Panel ════════════════════════════════════ -->
    <div id="modelPanelOverlay" class="model-panel-overlay"></div>
    <div id="modelPanel" class="model-panel" role="dialog" aria-modal="true" aria-label="Model Settings">
        <div class="model-panel-header">
            <h2>⚙️ Model Settings</h2>
            <button id="modelPanelClose" class="icon-btn" aria-label="Close">✕</button>
        </div>

        <div id="gpuStatusCard" class="gpu-status-card">
            <div class="gpu-status-icon" id="gpuStatusIcon">⏳</div>
            <div class="gpu-status-body">
                <div class="gpu-status-title" id="gpuStatusTitle">Detecting GPU…</div>
                <div class="gpu-status-detail" id="gpuStatusDetail">Checking WebGPU availability</div>
            </div>
            <div class="gpu-status-badge" id="gpuStatusBadge">—</div>
        </div>
        
        <div class="model-panel-section-title">Available Models</div>
        <div id="modelPresetList" class="model-preset-list">
            <!-- Filled by app.js when worker sends model-info -->
            <div class="preset-placeholder">Loading presets…</div>
        </div>

        <div class="model-panel-footer">
            <span id="activeModelLabel" class="active-model-label">No model loaded yet</span>
            <button id="applyModelBtn" class="apply-model-btn" disabled>Apply &amp; Reload</button>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
