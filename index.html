<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAMES — Free Local AI Chatbot</title>
    <meta name="description"
        content="JAMES is a free, private AI chatbot that runs entirely in your browser. Powered by WebGPU for fast local inference.">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Install Banner -->
    <div id="installBanner" class="install-banner hidden">
        <span>Install JAMES as an app for offline access!</span>
        <div class="install-actions">
            <button id="installBtn">Install</button>
            <button id="dismissInstallBtn">✕</button>
        </div>
    </div>

    <div class="main-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <button id="newChatBtn" class="new-thread-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                New Chat
            </button>
            <div id="chatList" class="chat-list"></div>
            <div class="sidebar-footer">
                <div class="footer-links">
                    <a href="about.html">About</a> · <a href="docs.html">Docs</a>
                </div>
                <div class="footer-credit">By Andrey Lopukhov</div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="terminal-container">
            <!-- Header -->
            <header class="terminal-header">
                <div class="header-left">
                    <button id="sidebarToggle" class="icon-btn" aria-label="Toggle Sidebar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <div class="status-indicator">
                        <div id="led" class="status-led led-idle"></div>
                        <span id="statusText">INITIALIZING...</span>
                    </div>
                </div>
                <div class="header-right">
                    <span class="version-tag">v1.0.6</span>
                    <button id="modelPanelBtn" class="icon-btn" title="Model Settings" aria-label="Open model settings">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                            </path>
                        </svg>
                    </button>
                </div>
            </header>

            <div id="progressContainer" class="progress-container">
                <div id="progFill" class="progress-fill"></div>
            </div>

            <div class="status-meta"></div>

            <!-- Chat Scroll Area -->
            <div id="chatLog" class="chat-log"></div>

            <!-- Input Box Area -->
            <main class="chat-wrapper">
                <div id="chat-messages" class="chat-container"></div>

                <div id="attachment-preview" class="attachment-preview"></div>

                <div class="input-area">
                    <input type="file" id="file-input" style="display: none;" multiple>
                    <button id="attach-button" title="Attach files">+</button>
                    <textarea id="user-input" placeholder="Ask JAMES anything..." rows="1"></textarea>
                    <button id="send-button">Send</button>
                    <button id="stop-button" style="display: none;">Stop</button>
                </div>
            </main>
        </main>

        <div id="sidebarOverlay"></div>
    </div>

    <!-- Model Selection Panel Modal -->
    <div id="modelPanelOverlay" class="model-panel-overlay"></div>
    <div id="modelPanel" class="model-panel" role="dialog" aria-modal="true" aria-label="Model Settings">
        <div class="model-panel-header">
            <h2>Model Settings</h2>
            <button id="modelPanelClose" class="icon-btn" aria-label="Close">✕</button>
        </div>

        <div id="gpuStatusCard" class="gpu-status-card">
            <div class="gpu-status-icon" id="gpuStatusIcon">⏳</div>
            <div class="gpu-status-body">
                <div class="gpu-status-title" id="gpuStatusTitle">Detecting Hardware…</div>
                <div class="gpu-status-detail" id="gpuStatusDetail">Checking WebGPU and WASM availability</div>
            </div>
            <div class="gpu-status-badge" id="gpuStatusBadge">—</div>
        </div>

        <div class="model-panel-section-title">Available Models</div>
        <div id="modelPresetList" class="model-preset-list">
            <div class="preset-placeholder">Loading presets…</div>
        </div>

        <div class="model-panel-footer">
            <div class="active-model-container">
                <div class="active-model-title">Current Model</div>
                <span id="activeModelLabel" class="active-model-label">No model loaded yet</span>
            </div>
            <button id="applyModelBtn" class="apply-model-btn" disabled>Apply & Reload</button>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>

</html>
